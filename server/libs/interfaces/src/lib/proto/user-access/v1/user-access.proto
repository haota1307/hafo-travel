syntax = "proto3";

package useraccess.v1;

service UserAccessService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUserById(GetUserByIdRequest) returns (GetUserByIdResponse);
  rpc SetUserRoles(SetUserRolesRequest) returns (GetUserByIdResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc GetRole(RoleIdRequest) returns (RoleResponse);
  rpc CreateRole(CreateRoleRequest) returns (RoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (RoleResponse);
  rpc DeleteRole(RoleIdRequest) returns (DeleteRoleResponse);
}

message CreateUserRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  repeated string roles = 4;
  string password = 5;
}

message CreateUserResponse {
  string message = 1;
}

message GetUserByIdRequest {
  string user_id = 1;
}

message GetUserByIdResponse {
  UserProfile user = 1;
}

message UserProfile {
  string id = 1;
  string user_id = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  repeated RoleProfile roles = 6;
  string created_at = 7;
  string updated_at = 8;
}

message RoleProfile {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string permissions = 4;
  string created_at = 5;
  string updated_at = 6;
}

message SetUserRolesRequest {
  string user_id = 1;
  repeated string roles = 2;
}

message ListRolesRequest {}

message ListRolesResponse {
  repeated RoleProfile roles = 1;
}

message RoleIdRequest {
  string id = 1;
}

message CreateRoleRequest {
  string name = 1;
  string description = 2;
  repeated string permissions = 3;
}

message UpdateRoleRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string permissions = 4;
}

message RoleResponse {
  RoleProfile role = 1;
}

message DeleteRoleResponse {
  string message = 1;
}
