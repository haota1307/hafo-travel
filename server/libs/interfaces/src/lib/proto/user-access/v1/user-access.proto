syntax = "proto3";

package useraccess.v1;

service UserAccessService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUserById(GetUserByIdRequest) returns (GetUserByIdResponse);
}

message CreateUserRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  repeated string roles = 4;
  string password = 5;
}

message CreateUserResponse {
  string message = 1;
}

message GetUserByIdRequest {
  string user_id = 1;
}

message GetUserByIdResponse {
  UserProfile user = 1;
}

message UserProfile {
  string id = 1;
  string user_id = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  repeated RoleProfile roles = 6;
  string created_at = 7;
  string updated_at = 8;
}

message RoleProfile {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string permissions = 4;
  string created_at = 5;
  string updated_at = 6;
}
