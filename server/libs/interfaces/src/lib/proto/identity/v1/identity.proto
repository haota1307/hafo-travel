syntax = "proto3";

package identity.v1;

service IdentityService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUserById(GetUserByIdRequest) returns (GetUserByIdResponse);
  rpc SetUserRoles(SetUserRolesRequest) returns (GetUserByIdResponse);
  rpc ListInternalUsers(ListInternalUsersRequest) returns (ListInternalUsersResponse);
  rpc GetInternalUser(InternalUserTarget) returns (InternalUserResponse);
  rpc UpdateInternalUser(UpdateInternalUserRequest) returns (InternalUserResponse);
  rpc SetInternalUserRole(SetInternalUserRoleRequest) returns (InternalUserResponse);
  rpc SetInternalUserStatus(SetInternalUserStatusRequest) returns (InternalUserResponse);
  rpc InviteInternalUser(InviteInternalUserRequest) returns (InternalUserInvitationResponse);
  rpc ResendInternalUserInvitation(ResendInternalUserInvitationRequest) returns (InternalUserInvitationResponse);
  rpc AcceptInvitation(ResetPasswordRequest) returns (AccountActionResponse);
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc GetRole(RoleIdRequest) returns (RoleResponse);
  rpc CreateRole(CreateRoleRequest) returns (RoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (RoleResponse);
  rpc DeleteRole(RoleIdRequest) returns (DeleteRoleResponse);
  rpc Register(EmailActionRequest) returns (AccountActionResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (AccountActionResponse);
  rpc ForgotPassword(EmailActionRequest) returns (AccountActionResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (AccountActionResponse);
  rpc GoogleLogin(GoogleLoginRequest) returns (AuthTokenPair);
  rpc Login(LoginRequest) returns (AuthTokenPair);
  rpc RefreshSession(RefreshSessionRequest) returns (AuthTokenPair);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
}

message CreateUserRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  repeated string roles = 4;
  reserved 5;
  reserved "password";
}

message CreateUserResponse {
  string message = 1;
}

message GetUserByIdRequest {
  string user_id = 1;
}

message GetUserByIdResponse {
  UserProfile user = 1;
  optional bool locked = 2;
  optional string access_version = 3;
}

message UserProfile {
  string id = 1;
  string user_id = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  repeated RoleProfile roles = 6;
  string created_at = 7;
  string updated_at = 8;
}

message RoleProfile {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string permissions = 4;
  string created_at = 5;
  string updated_at = 6;
  optional string display_name = 7;
  optional uint32 member_count = 8;
  optional string display_name_vi = 9;
  optional string display_name_en = 10;
}

message SetUserRolesRequest {
  string user_id = 1;
  repeated string roles = 2;
}

message InternalUserRole {
  string id = 1;
  string name = 2;
  optional string display_name = 3;
  optional string display_name_vi = 4;
  optional string display_name_en = 5;
}

message InternalUser {
  string user_id = 1;
  string first_name = 2;
  string last_name = 3;
  string email = 4;
  InternalUserRole role = 5;
  string status = 6;
  bool access_protected = 7;
  string created_at = 8;
  string updated_at = 9;
}

message ListInternalUsersRequest {
  string actor_user_id = 1;
}

message ListInternalUsersResponse {
  repeated InternalUser users = 1;
}

message InternalUserTarget {
  string user_id = 1;
  string actor_user_id = 2;
}

message InternalUserResponse {
  InternalUser user = 1;
}

message UpdateInternalUserRequest {
  string user_id = 1;
  string actor_user_id = 2;
  string first_name = 3;
  string last_name = 4;
}

message SetInternalUserRoleRequest {
  string user_id = 1;
  string actor_user_id = 2;
  repeated string roles = 3;
}

message SetInternalUserStatusRequest {
  string user_id = 1;
  string actor_user_id = 2;
  bool locked = 3;
}

message InviteInternalUserRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  repeated string roles = 4;
  string locale = 5;
  string actor_user_id = 6;
}

message ResendInternalUserInvitationRequest {
  string user_id = 1;
  string actor_user_id = 2;
  string locale = 3;
}

message InternalUserInvitationResponse {
  InternalUser user = 1;
  string invitation_delivery = 2;
}

message ListRolesRequest {}

message ListRolesResponse {
  repeated RoleProfile roles = 1;
}

message RoleIdRequest {
  string id = 1;
  optional bool include_member_count = 2;
}

message CreateRoleRequest {
  string name = 1;
  string description = 2;
  repeated string permissions = 3;
  optional string display_name = 4;
  optional string display_name_vi = 5;
  optional string display_name_en = 6;
}

message UpdateRoleRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  repeated string permissions = 4;
  optional string display_name = 5;
  optional string display_name_vi = 6;
  optional string display_name_en = 7;
}

message RoleResponse {
  RoleProfile role = 1;
}

message DeleteRoleResponse {
  string message = 1;
}

message EmailActionRequest {
  string email = 1;
  string locale = 2;
}

message VerifyEmailRequest {
  string token = 1;
  string first_name = 2;
  string last_name = 3;
  string password = 4;
}

message ResetPasswordRequest {
  string token = 1;
  string password = 2;
}

message GoogleLoginRequest {
  string credential = 1;
  optional string email_token = 2;
  optional string locale = 3;
}

message AccountActionResponse {}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthTokenPair {
  string access_token = 1;
  string refresh_token = 2;
  uint32 access_expires_in = 3;
  uint32 refresh_expires_in = 4;
}

message RefreshSessionRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}
